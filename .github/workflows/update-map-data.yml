name: Update Aalborg map data and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"
      timezone: "Europe/Copenhagen"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aalborg-pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest, so a GitHub image upgrade cannot break
    # osmium or Python setup on a Sunday. Move to a newer image deliberately.
    runs-on: ubuntu-24.04
    outputs:
      zone_refresh: ${{ steps.zone_snapshot.outcome }}
      health: ${{ steps.health.outcome }}
      health_report: ${{ steps.health_report.outputs.report }}
    env:
      # Generated by the scripts below and committed back when they change.
      DATA_FILES: >-
        bus-routes.js BUS_ROUTE_AUDIT.md transit-data.js TRANSIT_AUDIT.md
        poi-data.js POI_AUDIT.md hydro-data.js HYDRO_AUDIT.md
        zone-data.js ZONE_AUDIT.md scripts/play_area.geojson
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scheduled and manual runs always rebuild the data. A push rebuilds it
      # only when it changes the generators, so their effect is visible at once.
      - name: Decide whether to regenerate map data
        id: mode
        shell: bash
        run: |
          regen=true
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- scripts/ 2>/dev/null; then
              regen=false
            fi
          fi
          echo "regen=$regen" >> "$GITHUB_OUTPUT"
          echo "Regenerate map data: $regen"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check "shapely==2.1.2" "pyproj==3.7.2"

      - name: Install osmium
        if: steps.mode.outputs.regen == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Snapshot official Aalborg game zones
        id: zone_snapshot
        if: steps.mode.outputs.regen == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/update_zones.py

      - name: Warn if the municipal zone refresh was unavailable
        if: steps.mode.outputs.regen == 'true' && steps.zone_snapshot.outcome == 'failure'
        run: echo "::warning::KortInfo zone refresh failed or timed out. Continuing with the last committed zone/play-area snapshot; the browser still has its live WFS and built-in fallback."

      - name: Download current Rejseplanen GTFS
        if: steps.mode.outputs.regen == 'true'
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            https://www.rejseplanen.info/labs/GTFS.zip \
            --output GTFS.zip
          unzip -t GTFS.zip >/dev/null

      - name: Regenerate Aalborg bus routes
        if: steps.mode.outputs.regen == 'true'
        run: python scripts/update_bus_routes.py GTFS.zip

      - name: Regenerate Aalborg train lines and transit stops
        if: steps.mode.outputs.regen == 'true'
        run: python scripts/update_transit.py GTFS.zip

      - name: Download current Denmark OpenStreetMap extract
        if: steps.mode.outputs.regen == 'true'
        run: |
          curl --fail --location --retry 3 --retry-delay 8 \
            https://download.geofabrik.de/europe/denmark-latest.osm.pbf \
            --output denmark-latest.osm.pbf
          osmium fileinfo denmark-latest.osm.pbf >/dev/null

      - name: Extract Aalborg POI-relevant OpenStreetMap objects
        if: steps.mode.outputs.regen == 'true'
        run: |
          # First cut a padded Greater-Aalborg extract. The smart strategy keeps
          # multipolygon relations reference-complete, which matters for parks
          # and other area POIs near the edge of the game area.
          osmium extract \
            --bbox=9.70,56.94,10.25,57.18 \
            --strategy=smart \
            denmark-latest.osm.pbf \
            --output=aalborg-source.osm.pbf --overwrite
          osmium tags-filter \
            --expressions=scripts/poi-filter-expressions.txt \
            aalborg-source.osm.pbf \
            --output=poi-source.osm.pbf --overwrite
          osmium export poi-source.osm.pbf \
            --attributes=type,id \
            --output=poi-source.geojson --output-format=geojson --overwrite

      - name: Regenerate Aalborg Matching POIs
        if: steps.mode.outputs.regen == 'true'
        run: python scripts/update_pois.py poi-source.geojson

      - name: Extract Aalborg coastline and body-of-water geometry
        if: steps.mode.outputs.regen == 'true'
        run: |
          osmium tags-filter \
            --expressions=scripts/hydro-filter-expressions.txt \
            aalborg-source.osm.pbf \
            --output=hydro-source.osm.pbf --overwrite
          osmium export hydro-source.osm.pbf \
            --attributes=type,id \
            --output=hydro-source.geojson --output-format=geojson --overwrite

      - name: Regenerate Aalborg coastline and water geometry
        if: steps.mode.outputs.regen == 'true'
        run: python scripts/update_hydro.py hydro-source.geojson

      # Every deploy (push or scheduled refresh) must pass the test suite, so
      # neither a code change nor a freshly generated bundle can break the site.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run generator tests
        run: python -m unittest discover -s tests/python -v

      # Scheduled/manual runs also confirm the data is fresh and that every
      # outside service (data sources, basemaps, CDNs) still answers properly.
      # Problems do not block the deploy; the report job opens an issue instead.
      - name: Health check
        id: health
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/health_check.py --report health.md --max-age-days 8

      - name: Keep the health report
        id: health_report
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          [ -f health.md ] || echo "The health check did not run." > health.md
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'report<<EOF_HEALTH_REPORT'; cat health.md; echo 'EOF_HEALTH_REPORT'; } >> "$GITHUB_OUTPUT"

      - name: Show map-data changes
        if: steps.mode.outputs.regen == 'true'
        id: data_changes
        shell: bash
        run: |
          if git diff --quiet -- $DATA_FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No route, transit, POI, water, or zone changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated map data changed:"
            git diff --stat -- $DATA_FILES
            git diff -- '*_AUDIT.md' || true
          fi

      - name: Commit updated map-data bundles
        if: steps.mode.outputs.regen == 'true' && steps.data_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DATA_FILES
          git commit -m "Update Aalborg map data"
          # Someone may have pushed while the refresh ran; rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Publish only what the browser loads.
      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir _site
          cp index.html styles.css *.js _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the live site
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q 'app.js?v='; then echo "Live: $url"; exit 0; fi
            sleep 10
          done
          echo "::error::$url did not serve the map after deploying"
          exit 1

  # Runs after every scheduled or manual refresh, whatever happened above.
  report:
    needs: [build, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # GitHub switches off scheduled workflows in a repository with no
      # activity for 60 days. Re-enabling it every run keeps Sundays coming.
      - name: Keep the weekly schedule enabled
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/update-map-data.yml/enable"

      - name: Open, update or close the health issue
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          ZONES: ${{ needs.build.outputs.zone_refresh }}
          HEALTH: ${{ needs.build.outputs.health }}
          REPORT: ${{ needs.build.outputs.health_report }}
        run: |
          title="Weekly map-data refresh needs attention"
          label="map-data-health"
          problems=""
          [ "$BUILD" = "success" ] || problems+="- Refresh/build job: **$BUILD**. Data was not updated; see the run log."$'\n'
          [ "$DEPLOY" = "success" ] || problems+="- Deploy job: **$DEPLOY**. The live site was not updated."$'\n'
          [ "$ZONES" != "failure" ] || problems+="- KortInfo zone refresh failed; last week's zone snapshot was kept."$'\n'
          [ "$HEALTH" != "failure" ] || problems+="- The health check found problems (table below)."$'\n'

          gh label create "$label" --color B60205 --description "Weekly map-data refresh problems" 2>/dev/null || true
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')

          if [ -n "$problems" ]; then
            body="The weekly refresh on $(date -u +%Y-%m-%d) needs attention: $RUN_URL"$'\n\n'"$problems"$'\n'"$REPORT"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --label "$label" --body "$body"
            fi
            echo "::error::Problems found; see the '$title' issue."
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All good again in $RUN_URL."
          fi
          echo "Everything is healthy."
