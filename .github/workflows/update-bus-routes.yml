name: Update Aalborg map data and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"
      timezone: "Europe/Copenhagen"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aalborg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install map-data generator dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --disable-pip-version-check "shapely==2.1.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Snapshot official Aalborg game zones
        if: github.event_name != 'push'
        run: python scripts/update_zones.py

      - name: Download current Rejseplanen GTFS
        if: github.event_name != 'push'
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            https://www.rejseplanen.info/labs/GTFS.zip \
            --output GTFS.zip
          unzip -t GTFS.zip >/dev/null

      - name: Regenerate Aalborg bus routes
        if: github.event_name != 'push'
        run: python scripts/update_bus_routes.py GTFS.zip

      - name: Regenerate Aalborg train lines and transit stops
        if: github.event_name != 'push'
        run: python scripts/update_transit.py GTFS.zip

      - name: Download current Denmark OpenStreetMap extract
        if: github.event_name != 'push'
        run: |
          curl --fail --location --retry 3 --retry-delay 8 \
            https://download.geofabrik.de/europe/denmark-latest.osm.pbf \
            --output denmark-latest.osm.pbf
          osmium fileinfo denmark-latest.osm.pbf >/dev/null

      - name: Extract Aalborg POI-relevant OpenStreetMap objects
        if: github.event_name != 'push'
        run: |
          # First cut a padded Greater-Aalborg extract. The smart strategy keeps
          # multipolygon relations reference-complete, which matters for parks
          # and other area POIs near the edge of the game area.
          osmium extract \
            --bbox=9.70,56.94,10.25,57.18 \
            --strategy=smart \
            denmark-latest.osm.pbf \
            --output=aalborg-source.osm.pbf --overwrite
          osmium tags-filter \
            --expressions=scripts/poi-filter-expressions.txt \
            aalborg-source.osm.pbf \
            --output=poi-source.osm.pbf --overwrite
          osmium export poi-source.osm.pbf \
            --attributes=type,id \
            --output=poi-source.geojson --output-format=geojson --overwrite

      - name: Regenerate Aalborg Matching POIs
        if: github.event_name != 'push'
        run: python scripts/update_pois.py poi-source.geojson

      - name: Extract Aalborg coastline and body-of-water geometry
        if: github.event_name != 'push'
        run: |
          osmium tags-filter \
            --expressions=scripts/hydro-filter-expressions.txt \
            aalborg-source.osm.pbf \
            --output=hydro-source.osm.pbf --overwrite
          osmium export hydro-source.osm.pbf \
            --attributes=type,id \
            --output=hydro-source.geojson --output-format=geojson --overwrite

      - name: Regenerate Aalborg coastline and water geometry
        if: github.event_name != 'push'
        run: python scripts/update_hydro.py hydro-source.geojson

      - name: Show map-data changes
        if: github.event_name != 'push'
        id: data_changes
        shell: bash
        run: |
          if git diff --quiet -- bus-routes.js BUS_ROUTE_AUDIT.md transit-data.js TRANSIT_AUDIT.md poi-data.js POI_AUDIT.md hydro-data.js HYDRO_AUDIT.md zone-data.js ZONE_AUDIT.md scripts/play_area.geojson; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No route, transit, POI, water, or zone changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated map data changed:"
            git diff --stat -- bus-routes.js BUS_ROUTE_AUDIT.md transit-data.js TRANSIT_AUDIT.md poi-data.js POI_AUDIT.md hydro-data.js HYDRO_AUDIT.md zone-data.js ZONE_AUDIT.md scripts/play_area.geojson
            git diff -- BUS_ROUTE_AUDIT.md TRANSIT_AUDIT.md POI_AUDIT.md HYDRO_AUDIT.md ZONE_AUDIT.md || true
          fi

      - name: Commit updated map-data bundles
        if: github.event_name != 'push' && steps.data_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus-routes.js BUS_ROUTE_AUDIT.md transit-data.js TRANSIT_AUDIT.md poi-data.js POI_AUDIT.md hydro-data.js HYDRO_AUDIT.md zone-data.js ZONE_AUDIT.md scripts/play_area.geojson
          git commit -m "Update Aalborg map data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'GTFS.zip' \
            --exclude '*.pbf' \
            --exclude 'poi-source.geojson' \
            --exclude 'hydro-source.geojson' \
            --exclude '*.test.mjs' \
            --exclude '*.patch' \
            --exclude '*.zip'
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
